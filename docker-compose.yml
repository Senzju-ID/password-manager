version: '3.8'

services:
  pm-workspace:
    image: chialab/php-dev:8.3-v8
    container_name: pm_workspace
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "cd backend && php artisan serve --host=0.0.0.0 --port=8000 & cd frontend && npm run dev"
    environment:
      - DB_HOST=172.17.0.1
      - DB_DATABASE=password_manager
      
